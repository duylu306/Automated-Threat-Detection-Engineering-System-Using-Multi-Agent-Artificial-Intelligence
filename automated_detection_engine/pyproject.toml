[tool.poetry]
name = "automated-detection-engine"
version = "0.1.0"
description = "Multi-Agent AI System for Automated Sigma/YARA Rule Generation"
authors = ["Your Name <your@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

# LLM & AI Core
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-anthropic = "^0.2.0"
langchain-community = "^0.3.0"
langchain-huggingface = "^0.1.0"
openai = "^1.50.0"
anthropic = "^0.34.0"

# Vector DB
qdrant-client = "^1.11.0"
chromadb = "^0.5.0"

# Embeddings & Reranker
sentence-transformers = "^3.2.0"
transformers = "^4.45.0"
torch = "^2.4.0"

# Security / Detection
sigma-cli = "^1.0.0"
pySigma = "^0.11.0"
yara-python = "^4.5.0"
mitreattack-python = "^3.0.0"
stix2 = "^3.0.0"
iocextract = "^1.16.0"

# File Processing
PyMuPDF = "^1.24.0"
pdfplumber = "^0.11.0"
python-evtx = "^0.7.4"
beautifulsoup4 = "^4.12.0"
requests = "^2.32.0"

# NER
spacy = "^3.8.0"
gliner = "^0.2.0"

# Data
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
datasketch = "^1.6.0"
PyYAML = "^6.0.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"

# API Backend
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.31.0"}
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.1.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"

# Dev
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
black = "^24.0.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
